
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>
<body>
<h1 align="center">STUDENT REGISTRATION FORM</h1>
 <form>
 <fieldset>
<legend><b>Personal Information</b></legend>

            <label>Full Name:</label>
            <input type="text" name="name" placeholder="Enter your full name">
            <br><br>

            <label>Father's Name:</label>
            <input type="text" name="fathername" placeholder="Enter father's name">
            <br><br>

            <label>Mother's Name:</label>
            <input type="text" name="mothername" placeholder="Enter mother's name">
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" name="dob">
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other


        <br>

            <legend><b>Contact Information</b></legend>

            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email">
            <br><br>

            <label>Mobile Number:</label>
            <input type="tel" name="mobile" placeholder="Enter mobile number">
            <br><br>

            <label>Address:</label>
            <br>
            <textarea name="address" rows="4" cols="40"
            placeholder="Enter your complete address"></textarea>
            <br><br>

            <label>City:</label>
            <input type="text" name="city">
            <br><br>

            <label>State:</label>
            <select name="state">
                <option>Select State</option>
                <option>Uttar Pradesh</option>
                <option>Delhi</option>
                <option>Rajasthan</option>
                <option>Maharashtra</option>
                <option>Haryana</option>
                <option>Punjab</option>
            </select>

        <br>


            <legend><b>Academic Information</b></legend>

            <label>Course:</label>
            <select name="course">
                <option>Select Course</option>
                <option>B.Tech</option>
                <option>BCA</option>
                <option>BBA</option>
                <option>MCA</option>
                <option>MBA</option>
            </select>
            <br><br>

            <label>Branch:</label>
            <select name="branch">
                <option>Select Branch</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Artificial Intelligence</option>
                <option>Data Science</option>
                <option>Electronics</option>
            </select>
            <br><br>

            <label>Roll Number:</label>
            <input type="text" name="rollno">
            <br><br>

            <label>Semester:</label>
            <select name="semester">
                <option>Select Semester</option>
                <option>1st Semester</option>
                <option>2nd Semester</option>
                <option>3rd Semester</option>
                <option>4th Semester</option>
                <option>5th Semester</option>
                <option>6th Semester</option>
                <option>7th Semester</option>
                <option>8th Semester</option>
            </select>
            <br><br>

            <label>Previous Qualification:</label>
            <input type="text" name="qualification">

        

        <br>

            <legend><b>Additional Information</b></legend>

            <label>Hobbies:</label>
            <br>
            <input type="checkbox" name="hobby" value="reading"> Reading
            <input type="checkbox" name="hobby" value="sports"> Sports
            <input type="checkbox" name="hobby" value="coding"> Coding
            <input type="checkbox" name="hobby" value="music"> Music
            <input type="checkbox" name="hobby" value="travelling"> Travelling

            <br><br>

            <label>Upload Photograph:</label>
            <input type="file" name="photo">

       

        <br>

        
            <legend><b>Login Details</b></legend>

            <label>Username:</label>
            <input type="text" name="username">
            <br><br>

            <label>Password:</label>
            <input type="password" name="password">
            <br><br>

            <label>Confirm Password:</label>
            <input type="password" name="confirm_password">


        <br>

        <input type="checkbox" name="declaration">
        I declare that all the information provided above is correct.

        <br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">
</fieldset>
    </form>

</body>
</html>
