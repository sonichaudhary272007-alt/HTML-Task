
<!DOCTYPE html>
<html>
<head>
    <title>Interactive Applications</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #3730a3;
        }

        .container {
            background: white;
            padding: 25px;
            margin: 30px auto;
            width: 80%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #aaa;
        }

        input {
            padding: 10px;
            width: 60%;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #312e81;
        }

        li {
            list-style: none;
            background: #e0e7ff;
            padding: 10px;
            margin: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .delete {
            background: red;
        }

        .main-image {
            width: 100%;
            max-width: 450px;
            height: 280px;
            object-fit: cover;
            border-radius: 10px;
        }

        .thumbnails img {
            width: 90px;
            height: 70px;
            object-fit: cover;
            margin: 8px;
            cursor: pointer;
            border-radius: 8px;
            border: 3px solid transparent;
        }

        .thumbnails img:hover {
            border: 3px solid blue;
        }
    </style>
</head>

<body>

    <h1>Interactive JavaScript Applications</h1>

    <div class="container">

        <h2>My To-Do List</h2>

        <input type="text" id="taskInput"
               placeholder="Enter your task">

        <button id="addBtn">Add Task</button>

        <ul id="taskList"></ul>

    </div>


    <!-- IMAGE GALLERY -->

    <div class="container">

        <h2>Image Gallery</h2>

        <img id="mainImage"
             class="main-image"
             src="https://picsum.photos/id/10/600/400"
             alt="Selected gallery image">

        <div class="thumbnails">

            <img src="https://picsum.photos/id/10/150/100"
                 alt="Forest"
                 data-large="https://picsum.photos/id/10/600/400">

            <img src="https://picsum.photos/id/11/150/100"
                 alt="Nature"
                 data-large="https://picsum.photos/id/11/600/400">

            <img src="https://picsum.photos/id/15/150/100"
                 alt="Mountain"
                 data-large="https://picsum.photos/id/15/600/400">

            <img src="https://picsum.photos/id/28/150/100"
                 alt="Landscape"
                 data-large="https://picsum.photos/id/28/600/400">

        </div>

    </div>


    <script>

        // TO-DO LIST

        let taskInput = document.getElementById("taskInput");

        let addBtn = document.getElementById("addBtn");

        let taskList = document.getElementById("taskList");

        addBtn.addEventListener("click", function() {

            let task = taskInput.value.trim();

            if (task === "") {
                alert("Please enter a task!");
                return;
            }

            // Create a new list item

            let li = document.createElement("li");

            // Create task text

            let span = document.createElement("span");

            span.textContent = task;

            // Create delete button

            let deleteBtn = document.createElement("button");

            deleteBtn.textContent = "Delete";

            deleteBtn.className = "delete";

            // Remove task when delete button is clicked

            deleteBtn.addEventListener("click", function() {

                li.remove();

            });

            // Add elements to the list item

            li.appendChild(span);

            li.appendChild(deleteBtn);

            // Add list item to the ul

            taskList.appendChild(li);

            // Clear input

            taskInput.value = "";

        });


        // IMAGE GALLERY

        let mainImage = document.getElementById("mainImage");

        let thumbnails = document.querySelectorAll(".thumbnails img");


        // Add click event to every thumbnail

        thumbnails.forEach(function(image) {

            image.addEventListener("click", function() {

                mainImage.src = image.dataset.large;

            });

        });

    </script>

</body>
</html>
