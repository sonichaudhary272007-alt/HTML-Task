
<!DOCTYPE html>
<html>
<head>
    <title>Async JavaScript</title>

    <style>
        body {
            font-family: Arial;
            background: #eef2ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px gray;
        }

        button {
            background: #4f46e5;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Data</h1>

        <button onclick="fetchData()">
            Fetch Data
        </button>

        <div id="result"></div>

    </div>


    <script>

        function fetchData() {

            let result = document.getElementById("result");

            result.innerHTML = "Loading data...";

            // Simulate server delay

            setTimeout(function() {

                let student = {
                    name: "Rahul",
                    age: 21,
                    course: "Computer Science"
                };

                // Display received data

                result.innerHTML =
                    "<h3>Data Received!</h3>" +
                    "<p>Name: " + student.name + "</p>" +
                    "<p>Age: " + student.age + "</p>" +
                    "<p>Course: " + student.course + "</p>";

            }, 3000);

        }

    </script>

</body>
</html>
