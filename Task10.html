
<!DOCTYPE html>
<html>
<head>
    <title>University Finder</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 30px;
        }
       .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #3730a3;
        }
      .search-box {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .university {
            background: #f8fafc;
            padding: 15px;
            margin: 12px 0;
            border-left: 4px solid #4f46e5;
            border-radius: 6px;
        }

        .university h3 {
            margin-top: 0;
            color: #1e293b;
        }
        a {
            color: #4f46e5;
            word-break: break-all;
        }

        #message {
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1> University Finder</h1>

    <p style="text-align:center">
        Find universities from different countries.
    </p>

    <div class="search-box">
        <input
            type="text"
            id="country"
            placeholder="Enter country name (e.g. India)"
        >

        <button onclick="getUniversities()">
            Search
        </button>
    </div>

    <p id="message"></p>

    <div id="results"></div>

</div>

<script>

async function getUniversities() {

    const country = document.getElementById("country").value.trim();
    const results = document.getElementById("results");
    const message = document.getElementById("message");

    results.innerHTML = "";

    if (!country) {
        message.innerText = "Please enter a country name!";
        return;
    }

    message.innerText = "Loading...";

    try {

        const url = `http://universities.hipolabs.com/search?country=${encodeURIComponent(country)}`;

        const response = await fetch(url);

        console.log("Response status:", response.status);

        if (!response.ok) {
            throw new Error("HTTP Error: " + response.status);
        }

        const universities = await response.json();

        console.log("University data:", universities);

        if (universities.length === 0) {
            message.innerText = "No universities found!";
            return;
        }

        message.innerText =
            `Found ${universities.length} universities.`;

        universities.forEach(university => {

            const div = document.createElement("div");

            div.className = "university";

            div.innerHTML = `
                <h3>${university.name}</h3>
                <p>
                    Website:
                    <a href="${university.web_pages?.[0] || '#'}"
                       target="_blank"
                       rel="noopener noreferrer">
                       ${university.web_pages?.[0] || "Not available"}
                    </a>
                </p>
            `;

            results.appendChild(div);

        });

    } catch (error) {

        console.error("API Error:", error);

        message.innerText = error.message;

    }
}

</body>
</html>
